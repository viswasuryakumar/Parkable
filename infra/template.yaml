AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Description: Parkable API Gateway + Lambda stack for /scan, /check, and /nearby

Globals:
  Api:
    # Answers the browser's preflight OPTIONS for the Expo web build; the
    # Lambda responses carry their own Access-Control-Allow-Origin header
    # (Responses.java) for the actual GET/POST answers.
    Cors:
      AllowOrigin: "'*'"
      AllowHeaders: "'Content-Type'"
      AllowMethods: "'GET,POST,OPTIONS'"

Parameters:
  DatabaseUrlParameter:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /parkable/db-url
    Description: SSM path for the Supabase/Postgres connection string
  OpenRouterApiKeyParameter:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /parkable/openrouter-api-key
    Description: SSM path for the OpenRouter API key used by live extraction (cheapest vision-capable model, see OpenRouterVisionExtractor)
  BucketName:
    Type: String
    Default: parkable-photos
    Description: Name of the S3 bucket used for scan photos
  AdminSecretParameter:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /parkable/admin-secret
    Description: SSM path for the shared secret gating GET /reports (owner-only report review, no real auth system)

Resources:
  PhotosBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref BucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  CheckFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: parkable-check
      Runtime: java21
      Timeout: 30
      MemorySize: 1024
      CodeUri: ../backend/target/parkable-cli.jar
      Handler: com.parkable.lambda.CheckHandler::handleRequest
      Environment:
        Variables:
          PARKABLE_DB_URL: !Ref DatabaseUrlParameter
          OPENROUTER_API_KEY: !Ref OpenRouterApiKeyParameter
          PARKABLE_PHOTO_BUCKET: !Ref PhotosBucket
      Policies:
        - Statement:
            - Sid: ReadParameters
              Effect: Allow
              Action:
                - ssm:GetParameter
                - ssm:GetParameters
              Resource: '*'
            - Sid: ReadWritePhotos
              Effect: Allow
              Action:
                - s3:PutObject
                - s3:GetObject
                - s3:ListBucket
              Resource:
                - !Sub arn:aws:s3:::${PhotosBucket}
                - !Sub arn:aws:s3:::${PhotosBucket}/*
      Events:
        CheckRoute:
          Type: Api
          Properties:
            Path: /check
            Method: get

  NearbyFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: parkable-nearby
      Runtime: java21
      Timeout: 30
      MemorySize: 1024
      CodeUri: ../backend/target/parkable-cli.jar
      Handler: com.parkable.lambda.NearbyHandler::handleRequest
      Environment:
        Variables:
          PARKABLE_DB_URL: !Ref DatabaseUrlParameter
          OPENROUTER_API_KEY: !Ref OpenRouterApiKeyParameter
          PARKABLE_PHOTO_BUCKET: !Ref PhotosBucket
      Policies:
        - Statement:
            - Sid: ReadParameters
              Effect: Allow
              Action:
                - ssm:GetParameter
                - ssm:GetParameters
              Resource: '*'
            - Sid: ReadWritePhotos
              Effect: Allow
              Action:
                - s3:PutObject
                - s3:GetObject
                - s3:ListBucket
              Resource:
                - !Sub arn:aws:s3:::${PhotosBucket}
                - !Sub arn:aws:s3:::${PhotosBucket}/*
      Events:
        NearbyRoute:
          Type: Api
          Properties:
            Path: /nearby
            Method: get

  ScanFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: parkable-scan
      Runtime: java21
      Timeout: 30
      MemorySize: 1024
      CodeUri: ../backend/target/parkable-cli.jar
      Handler: com.parkable.lambda.ScanHandler::handleRequest
      Environment:
        Variables:
          PARKABLE_DB_URL: !Ref DatabaseUrlParameter
          OPENROUTER_API_KEY: !Ref OpenRouterApiKeyParameter
          # Not secret - a model id, not a credential - so a plain literal
          # here (vs. an SSM param like the two above) is fine. History:
          # unset/defaulting to gpt-4o-mini -> switched to claude-sonnet-5
          # after live scans mis-transcribed sign text -> switched again
          # (2026-08-01) to gemini-2.5-flash-lite after burning through
          # OpenRouter credits fast at sonnet-5's $2/$10 per-1M-token rate -
          # flash-lite is $0.10/$0.40, a real ~20x cut, verified live against
          # OpenRouter's own pricing API (not from memory - catalog/pricing
          # changes often). Not yet proven on THIS project's dense
          # multi-panel signs the way sonnet-5 was - if extraction quality
          # regresses, google/gemini-2.5-flash ($0.30/$2.50, still ~7x
          # cheaper) or anthropic/claude-haiku-4.5 ($1/$5, ~2x cheaper) are
          # the next steps up in quality before going back to sonnet-5.
          # gpt-4o-mini specifically is already ruled out - that's the model
          # that caused the original mis-transcription bug.
          OPENROUTER_MODEL: google/gemini-2.5-flash-lite
          PARKABLE_PHOTO_BUCKET: !Ref PhotosBucket
      Policies:
        - Statement:
            - Sid: ReadParameters
              Effect: Allow
              Action:
                - ssm:GetParameter
                - ssm:GetParameters
              Resource: '*'
            - Sid: ReadWritePhotos
              Effect: Allow
              Action:
                - s3:PutObject
                - s3:GetObject
                - s3:ListBucket
              Resource:
                - !Sub arn:aws:s3:::${PhotosBucket}
                - !Sub arn:aws:s3:::${PhotosBucket}/*
      Events:
        ScanRoute:
          Type: Api
          Properties:
            Path: /scan
            Method: post

  ReportFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: parkable-report
      Runtime: java21
      Timeout: 30
      MemorySize: 512
      CodeUri: ../backend/target/parkable-cli.jar
      Handler: com.parkable.lambda.ReportHandler::handleRequest
      Environment:
        Variables:
          PARKABLE_DB_URL: !Ref DatabaseUrlParameter
      Policies:
        - Statement:
            - Sid: ReadParameters
              Effect: Allow
              Action:
                - ssm:GetParameter
                - ssm:GetParameters
              Resource: '*'
      Events:
        ReportRoute:
          Type: Api
          Properties:
            Path: /report
            Method: post

  ReportsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: parkable-reports
      Runtime: java21
      Timeout: 30
      MemorySize: 512
      CodeUri: ../backend/target/parkable-cli.jar
      Handler: com.parkable.lambda.ReportsHandler::handleRequest
      Environment:
        Variables:
          PARKABLE_DB_URL: !Ref DatabaseUrlParameter
          PARKABLE_ADMIN_SECRET: !Ref AdminSecretParameter
      Policies:
        - Statement:
            - Sid: ReadParameters
              Effect: Allow
              Action:
                - ssm:GetParameter
                - ssm:GetParameters
              Resource: '*'
      Events:
        ReportsRoute:
          Type: Api
          Properties:
            Path: /reports
            Method: get

Outputs:
  ApiEndpoint:
    Description: API Gateway endpoint for Parkable
    Value: !Sub https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod
  BucketName:
    Description: S3 bucket for uploaded scan photos
    Value: !Ref PhotosBucket
