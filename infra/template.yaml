AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Description: Parkable API Gateway + Lambda stack for /scan, /check, and /nearby

Globals:
  Api:
    # Answers the browser's preflight OPTIONS for the Expo web build; the
    # Lambda responses carry their own Access-Control-Allow-Origin header
    # (Responses.java) for the actual GET/POST answers.
    Cors:
      AllowOrigin: "'*'"
      AllowHeaders: "'Content-Type'"
      AllowMethods: "'GET,POST,OPTIONS'"

Parameters:
  DatabaseUrlParameter:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /parkable/db-url
    Description: SSM path for the Supabase/Postgres connection string
  OpenRouterApiKeyParameter:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /parkable/openrouter-api-key
    Description: SSM path for the OpenRouter API key used by live extraction (cheapest vision-capable model, see OpenRouterVisionExtractor)
  BucketName:
    Type: String
    Default: parkable-photos
    Description: Name of the S3 bucket used for scan photos

Resources:
  PhotosBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref BucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  CheckFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: parkable-check
      Runtime: java21
      Timeout: 30
      MemorySize: 1024
      CodeUri: ../backend/target/parkable-cli.jar
      Handler: com.parkable.lambda.CheckHandler::handleRequest
      Environment:
        Variables:
          PARKABLE_DB_URL: !Ref DatabaseUrlParameter
          OPENROUTER_API_KEY: !Ref OpenRouterApiKeyParameter
          PARKABLE_PHOTO_BUCKET: !Ref PhotosBucket
      Policies:
        - Statement:
            - Sid: ReadParameters
              Effect: Allow
              Action:
                - ssm:GetParameter
                - ssm:GetParameters
              Resource: '*'
            - Sid: ReadWritePhotos
              Effect: Allow
              Action:
                - s3:PutObject
                - s3:GetObject
                - s3:ListBucket
              Resource:
                - !Sub arn:aws:s3:::${PhotosBucket}
                - !Sub arn:aws:s3:::${PhotosBucket}/*
      Events:
        CheckRoute:
          Type: Api
          Properties:
            Path: /check
            Method: get

  NearbyFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: parkable-nearby
      Runtime: java21
      Timeout: 30
      MemorySize: 1024
      CodeUri: ../backend/target/parkable-cli.jar
      Handler: com.parkable.lambda.NearbyHandler::handleRequest
      Environment:
        Variables:
          PARKABLE_DB_URL: !Ref DatabaseUrlParameter
          OPENROUTER_API_KEY: !Ref OpenRouterApiKeyParameter
          PARKABLE_PHOTO_BUCKET: !Ref PhotosBucket
      Policies:
        - Statement:
            - Sid: ReadParameters
              Effect: Allow
              Action:
                - ssm:GetParameter
                - ssm:GetParameters
              Resource: '*'
            - Sid: ReadWritePhotos
              Effect: Allow
              Action:
                - s3:PutObject
                - s3:GetObject
                - s3:ListBucket
              Resource:
                - !Sub arn:aws:s3:::${PhotosBucket}
                - !Sub arn:aws:s3:::${PhotosBucket}/*
      Events:
        NearbyRoute:
          Type: Api
          Properties:
            Path: /nearby
            Method: get

  ScanFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: parkable-scan
      Runtime: java21
      Timeout: 30
      MemorySize: 1024
      CodeUri: ../backend/target/parkable-cli.jar
      Handler: com.parkable.lambda.ScanHandler::handleRequest
      Environment:
        Variables:
          PARKABLE_DB_URL: !Ref DatabaseUrlParameter
          OPENROUTER_API_KEY: !Ref OpenRouterApiKeyParameter
          # Not secret - a model id, not a credential - so a plain literal
          # here (vs. an SSM param like the two above) is fine. Was
          # unset/defaulting to gpt-4o-mini; switched to a stronger vision
          # model after live scans mis-transcribed sign text. Check
          # https://openrouter.ai/models before assuming this is still
          # current - pricing/catalog changes often (see
          # OpenRouterVisionExtractor's DEFAULT_MODEL javadoc).
          OPENROUTER_MODEL: anthropic/claude-sonnet-5
          PARKABLE_PHOTO_BUCKET: !Ref PhotosBucket
      Policies:
        - Statement:
            - Sid: ReadParameters
              Effect: Allow
              Action:
                - ssm:GetParameter
                - ssm:GetParameters
              Resource: '*'
            - Sid: ReadWritePhotos
              Effect: Allow
              Action:
                - s3:PutObject
                - s3:GetObject
                - s3:ListBucket
              Resource:
                - !Sub arn:aws:s3:::${PhotosBucket}
                - !Sub arn:aws:s3:::${PhotosBucket}/*
      Events:
        ScanRoute:
          Type: Api
          Properties:
            Path: /scan
            Method: post

  ReportFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: parkable-report
      Runtime: java21
      Timeout: 30
      MemorySize: 512
      CodeUri: ../backend/target/parkable-cli.jar
      Handler: com.parkable.lambda.ReportHandler::handleRequest
      Environment:
        Variables:
          PARKABLE_DB_URL: !Ref DatabaseUrlParameter
      Policies:
        - Statement:
            - Sid: ReadParameters
              Effect: Allow
              Action:
                - ssm:GetParameter
                - ssm:GetParameters
              Resource: '*'
      Events:
        ReportRoute:
          Type: Api
          Properties:
            Path: /report
            Method: post

Outputs:
  ApiEndpoint:
    Description: API Gateway endpoint for Parkable
    Value: !Sub https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod
  BucketName:
    Description: S3 bucket for uploaded scan photos
    Value: !Ref PhotosBucket
