name: Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'infra/**'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'infra/**'
  # Deploy is manual-trigger only (see the deploy job below) - GitHub's
  # "required reviewers" environment protection needs a paid plan on a
  # private repo, so a button-press trigger gets the same "nothing reaches
  # AWS without a deliberate action" guarantee without that dependency.
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Run backend test suite
        working-directory: backend
        run: mvn -B test

  deploy:
    needs: test
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Package backend jar
        working-directory: backend
        run: mvn -B clean package -DskipTests
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-1
      - name: Package CloudFormation template
        working-directory: infra
        run: >
          aws cloudformation package
          --template-file template.yaml
          --s3-bucket parkable-photos
          --output-template-file packaged.yaml
      - name: Deploy
        working-directory: infra
        run: >
          aws cloudformation deploy
          --template-file packaged.yaml
          --stack-name parkable-api
          --capabilities CAPABILITY_IAM
          --region us-west-1
